<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Maze</title>
        <script src="backend.js"></script>
        <script src="script.js"></script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="wrapper">
            <canvas></canvas>
            <div class="forms-wrapper">
                <form action="#" id="form1">
                    <label
                        >Select file
                        <input type="file" name="file" accept=".txt" required />
                    </label>
                    <p>Start:</p>
                    <fieldset class="grid">
                        <label
                            >X
                            <input
                                type="number"
                                min="0"
                                max="50"
                                value="0"
                                step="1"
                                name="startX"
                            />
                        </label>
                        <label
                            >Y
                            <input
                                type="number"
                                min="0"
                                max="50"
                                value="0"
                                step="1"
                                name="startY"
                            />
                        </label>
                    </fieldset>
                    <p>End:</p>
                    <fieldset class="grid">
                        <label
                            >X
                            <input
                                type="number"
                                min="0"
                                max="50"
                                value="0"
                                step="1"
                                name="endX"
                            />
                        </label>
                        <label
                            >Y
                            <input
                                type="number"
                                min="0"
                                max="50"
                                value="0"
                                step="1"
                                name="endY"
                            />
                        </label>
                    </fieldset>
                    <label
                        >Path:
                        <input type="checkbox" name="path" />
                    </label>
                </form>
                <form action="#" id="form2">
                    <h5>Generate maze</h5>
                    <fieldset class="grid">
                        <label
                            >Rows
                            <input
                                type="number"
                                min="0"
                                max="50"
                                value="0"
                                step="1"
                                name="rows"
                                required
                            />
                        </label>
                        <label
                            >Cols
                            <input
                                type="number"
                                min="0"
                                max="50"
                                value="0"
                                step="1"
                                name="cols"
                                required
                            />
                        </label>
                    </fieldset>
                    <button type="submit">Generate</button>
                    <a href="#" type="button" class="secondary download"
                        >Download maze</a
                    >
                </form>
            </div>
        </div>
    </body>
</html>
